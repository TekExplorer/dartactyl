  build_runner: '>=2.4.7 <4.0.0'
  # custom_lint: ^0.7.5
  # freezed_lint: ^0.0.9
  freezed: ^3.0.6
  json_serializable: '>=6.7.0'
  mocktail: ^1.0.1
